<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城市公共信息服务</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #1f2937; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 40px; }
    .top { background: #0f172a; color: #fff; padding: 14px 16px; border-radius: 10px; font-size: 14px; }
    .card { background: #fff; margin-top: 14px; padding: 18px; border-radius: 10px; border: 1px solid #e5e7eb; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    h2 { margin: 0 0 10px; font-size: 18px; }
    p { margin: 8px 0; line-height: 1.6; color: #374151; }
    ul { margin: 8px 0 0 18px; padding: 0; }
    li { margin: 6px 0; color: #374151; }
    .foot { margin-top: 16px; font-size: 12px; color: #6b7280; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">城市公共信息服务平台 · Public Information Portal</div>

    <div class="card">
      <h1>欢迎访问</h1>
      <p>本页面用于展示公开信息和服务入口，系统提供稳定的在线访问能力，支持 7x24 小时服务。</p>
    </div>

    <div class="card">
      <h2>公告信息</h2>
      <ul>
        <li>系统维护时间：每周三 02:00 - 03:00（UTC+8）。</li>
        <li>如遇访问异常，请稍后重试。</li>
        <li>为保障服务质量，系统会定期进行安全与性能优化。</li>
      </ul>
    </div>

    <div class="card">
      <h2>服务说明</h2>
      <p>本平台仅提供公开信息展示及基础服务入口，不收集与本页无关的个人敏感数据。</p>
    </div>

    <div class="foot">© 2026 Public Service Platform</div>
  </div>
</body>
</html>
